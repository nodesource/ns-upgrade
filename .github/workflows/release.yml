name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  authorize:
    name: Check release permission
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require main and an admin or maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main, not $REF"
            exit 1
          fi

          ROLE=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .role_name)
          case "$ROLE" in
            admin|maintain) echo "::notice::$ACTOR ($ROLE) may release" ;;
            *) echo "::error::Only admins and maintainers can release; $ACTOR has the $ROLE role"; exit 1 ;;
          esac

  test:
    name: Tests
    needs: authorize
    permissions:
      contents: read
    uses: ./.github/workflows/pnpm-tests.yml

  # ns-shared-workflows is internal, and a public repository cannot call its workflows,
  # so the steps of its tag-semver and release-npm workflows live here
  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing v$VERSION (bump=$BUMP, base=$LATEST)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Trusted publishing needs npm 11.5.1+ (newer than what Node 22 bundles) and Node 22.14.0+
      - name: Update npm
        run: npm install -g npm@11.21.0

      - name: Bump version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version
          git commit -am "chore(release): $VERSION [skip ci]"
          git tag -a "v$VERSION" -m "Release v$VERSION"

      # Publish before pushing, so a failed publish leaves nothing behind and can simply be rerun.
      # A version already on npm is skipped, so a rerun after a failed push can still finish.
      # No token: npm exchanges the job's OIDC token with the trusted publisher on npmjs.com
      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
            echo "::error::main moved during the release; run it again"
            exit 1
          fi

          if npm view "@nodesource/upgrade@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::v$VERSION is already on npm, skipping the publish"
          else
            npm publish --access public
          fi

      - name: Push version and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git push --atomic origin HEAD:main "v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --generate-notes --verify-tag --title "v$VERSION" --latest
